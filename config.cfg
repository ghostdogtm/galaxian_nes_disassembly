# ld65 config: iNES header + 8KB $FF padding (CPU $C000-$DFFF) + 8KB PRG (CPU $E000-$FFFF) + 8KB CHR
MEMORY {
    HDR: start = $0000, size = $0010, type = ro, file = %O, fill = yes, fillval = $FF;
    PAD: start = $C000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG: start = $E000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR: start = $0000, size = $2000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    HEADER:  load = HDR, type = ro;
    PRG:     load = PRG, type = ro;
    CHR_ROM: load = CHR, type = ro;
}

FILES {
    %O: format = bin;
}
